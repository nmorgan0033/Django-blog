name: Docker Image CI

on:
  push:
    branches: ["feature/ci-pipeline"]

  pull_request:
    branches: ["feature/ci-pipeline"]

jobs:
  build:
    name: Build and Test Docker Compose Stack
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database managed by GitHub Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: djangoblog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d djangoblog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Docker Compose networking
      - name: Configure Docker Compose for CI services
        run: |
          cat <<'EOF' > docker-compose.override.yml
          services:
            web:
              extra_hosts:
                - "host.docker.internal:host-gateway"
          EOF

      # 3. Validate Docker environment
      - name: Validate Docker environment
        run: |
          docker --version
          docker compose version

      # 4. Create CI environment file
      - name: Set up .env file
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          printf '%s\n' \
            "SECRET_KEY=${SECRET_KEY:-ci-test-key-not-for-production}" \
            "DEBUG=False" \
            "ALLOWED_HOSTS=*" \
            "DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/djangoblog" \
            "DATABASE_URL_UNPOOLED=postgresql://postgres:postgres@host.docker.internal:5432/djangoblog" \
            "CLOUDINARY_URL=${CLOUDINARY_URL:-cloudinary://dummy:dummy@dummy}" \
            > .env

      # 5. Build Docker Compose services
      - name: Build Docker Compose services
        run: |
          docker compose build

      # 6. Verify Docker images and Compose configuration
      - name: Verify Docker images
        run: |
          docker compose config --services
          docker compose images
          docker images

      # 7. Run database migrations
      - name: Run database migrations
        run: |
          docker compose run --rm web python manage.py migrate

      # 8. Run Django tests
      - name: Run Django tests
        run: |
          docker compose run --rm web python manage.py test

      # 9. Start Django service so Nginx can resolve web:8000
      - name: Start Django service
        run: |
          docker compose up -d web

      # 10. Validate Nginx configuration
      - name: Validate Nginx configuration
        run: |
          docker compose run --rm --no-deps nginx nginx -t

      # 11. Start the full stack
      - name: Start Docker Compose stack
        run: |
          docker compose up -d

      # 12. Smoke test Nginx -> Django
      - name: Stack Smoke Test
        run: |
          echo "Waiting for Nginx and Django..."

          timeout 60s bash -c '
            until curl -sS http://localhost:80 -o /dev/null; do
              sleep 2
            done
          ' || {
            echo "Smoke test failed!"
            docker compose logs
            exit 1
          }

          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:80)

          echo "Received HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Expected HTTP 200 but received $HTTP_STATUS"
            docker compose logs
            exit 1
          fi

          echo "Stack smoke test passed!"

      # 13. Teardown
      - name: Teardown Docker Compose stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
