
services:
  web:
    build: .
    expose:
      - "8000"
    volumes:
      - .:/code
    env_file:
      - .env
    command: gunicorn DjangoProject.wsgi:application --bind 0.0.0.0:8000 --workers 2
    # command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
